spring:
  datasource:
    url: jdbc:h2:mem:employee_db
    username: sa
    password: ""

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true

logging:
  level:
    '[com.raulrobles.employeeapi]': DEBUG
    '[org.springframework.web]': DEBUG
    '[org.hibernate]': ERROR